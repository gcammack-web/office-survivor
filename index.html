<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <h1>Simple Quest</h1>
    <p id="status">Explore the village. Talk to the villager.</p>
    <div id="hud-row">
      <p id="hud">Gems: <span id="gems">0</span> / <span id="gems-total">3</span></p>
      <p id="hp-hud">HP: <span id="hp">10/10</span></p>
      <p id="map-hud">Map: <span id="map-name">Village</span></p>
    </div>
  </div>
  <canvas id="game" width="640" height="480"></canvas>
  <p id="controls">
    Move: WASD · Attack: J · Talk: Space · Inventory: I · Use item: E · Quick potion: Q
  </p>
  <script type="module" src="js/main.js"></script>
</body>
</html>
